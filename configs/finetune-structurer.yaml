# Fine-tune the Arm-B structurer (google/gemma-4-E4B-it) via text-only LoRA (issue #55).
#
# All knobs are validated by horus.finetune.config.FinetuneConfig at boot
# (horus-config-discipline: Pydantic-validates-at-boot, fails fast before any model loads).
# The structuring prompt is NOT duplicated here — it is loaded from configs/arm-b.yaml's
# cohort.prompt_template_override so the zero-shot baseline, the training targets, and the
# fine-tuned eval provably share ONE instruction string (matched-precision; ADR-034/038).
#
# Sequence:
#   1. uv run python scripts/finetune_seal_split.py                       # seal split (done once)
#   2. baseline already committed: data/finetune/eval-zeroshot-qwen-adr059-val.json
#      (mean_overall_micro_f1 = 0.8257 — the ADR-054 gate reading, < 0.90)
#   3. uv run python scripts/finetune_train.py                            # LoRA SFT
#   4. pick the epoch on the DEV slice, then score the sealed val ONCE with that adapter
#
# Checkpoint selection (ADR-067): a dev slice is carved out of the sealed TRAIN side and
# used as the in-training validation signal, so the sealed 29 are never looked at during
# training and the epoch is not chosen on the set that gets reported. `split.json` is not
# rewritten — the carve is a reproducible derivation, so its fingerprints still verify.
#
# Refs: ADR-038 (Arm-B structurer), ADR-067 (this recipe), issue #55, plan
# ~/.windsurf/plans/horus-reader-8b-then-lora-5a47b9.md.

structurer_model: google/gemma-4-E4B-it
structuring_prompt_config: configs/arm-b.yaml
corpus_root: data/raw/german/zugferd-corpus
transcript_dir: docs/sources/transcripts-multipage
# ADR-057: canonical reader lineage switched to the bake-off winner (Qwen3-VL-4B,
# bf16 CUDA regeneration of all 146 GT-bearing invoices, blank-page guard active).
# The superseded granite transcripts stay in the same dir per ADR-011 retention.
reader_model: Qwen/Qwen3-VL-4B-Instruct
split_path: data/finetune/split.json
adapter_dir: data/finetune/adapter
# Dev slice carved from TRAIN (never from val) for epoch selection. 0.15 of 117 ≈ 18,
# leaving ~99 to fit on. Stratified by subdir × profile, same procedure as the outer seal.
dev_fraction: 0.15
dev_seed: 4242
eval_max_tokens: 2048
min_self_overall: 0.95

lora:
  rank: 8
  alpha: 16.0
  dropout: 0.05

train:
  learning_rate: 1.0e-4
  batch_size: 1
  gradient_accumulation_steps: 8
  # 6 epochs is a BUDGET, not a target. The dev slice picks the epoch; published guidance
  # puts the sweet spot at 1-3 for datasets under ~500 examples, so the later epochs exist
  # to make the overfitting turn visible rather than to be used. Training past the best
  # checkpoint costs wall-clock, not correctness — the adapter chosen is the one dev likes.
  epochs: 6
  max_seq_length: 0          # 0 = auto: longest example rounded up, capped at max_seq_length_cap
  max_seq_length_cap: 8192
  train_on_completions: true # mask loss to the assistant turn (the JSON answer) only
  grad_clip: 1.0
  grad_checkpoint: true       # required: 7.5B 4-bit + seq ~3k OOMs without it on M1 Pro 16 GB
  free_vision_audio: true     # text-only SFT: drop the unused vision+audio towers (frees ~GB)
  wired_limit_gb: 0.0         # 12.7 GB Metal cap is hard (raises above it are rejected); leave default
  seed: 42
  steps_per_report: 10
  steps_per_save: 0            # 0 = derive from checkpoint_every_epoch below
  checkpoint_every_epoch: true # one selectable adapter per epoch
  lr_schedule: cosine          # constant is mlx_vlm's default; cosine+warmup is the small-data norm
  warmup_ratio: 0.03           # LoRA's B matrix starts at zero — the first steps are the worst gradients
  lr_min_ratio: 0.1            # cosine floor, as a fraction of learning_rate
