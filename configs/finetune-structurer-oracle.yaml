# Oracle-input LoRA arm — an ATTRIBUTION INSTRUMENT, not a deployable adapter (ADR-067).
#
# Why this arm exists
# -------------------
# Gemma already scores overall_micro_f1 = 0.9719 on perfect GT-rendered text
# (`data/finetune/eval-oracle-adr059-val.json`) against a 0.90 gate, while scoring 0.8257 on
# real Qwen3-VL-4B reader text (`data/finetune/eval-zeroshot-qwen-adr059-val.json`). So the
# shortfall to the gate is NOT raw capability — it is behaviour under reader noise.
#
# That makes a reader-arm gain ambiguous on its own: it could be the adapter learning the
# output schema, or the adapter learning to survive reader artifacts. Training a second
# adapter on perfect text disambiguates, because this arm sees NO reader noise at all:
#
#            evaluate on reader text        evaluate on oracle text
#   reader   the deployable number          did noise-training cost clean accuracy?
#   oracle   does schema-learning transfer? headroom above the 0.9719 ceiling
#
# Everything except the input distribution is held identical to the reader arm: same sealed
# split, same dev carve (seed + fraction), same prompt, same targets, same self-consistency
# gate, same hyperparameters. The invoice SET is also identical — readiness still gates
# membership, so this arm trains on the same invoices, only with different input text.
#
# Usage (on the GPU box):
#   uv run python scripts/finetune_train_cuda.py --config configs/finetune-structurer-oracle.yaml
#
# Refs: ADR-067 (recipe + 2x2 design), ADR-068 (venue), ADR-059 (the oracle instrument
# whose renderer this arm reuses verbatim via `render_oracle_transcript`), issue #55.

structurer_model: google/gemma-4-E4B-it
structuring_prompt_config: configs/arm-b.yaml
corpus_root: data/raw/german/zugferd-corpus
transcript_dir: docs/sources/transcripts-multipage
# Still required: readiness (GT + cached transcript) defines sealed-split membership, so the
# reader lineage must resolve even though this arm does not feed reader text to the model.
reader_model: Qwen/Qwen3-VL-4B-Instruct
split_path: data/finetune/split.json

# THE difference from the reader arm.
input_arm: oracle
adapter_dir: data/finetune/adapter-oracle

dev_fraction: 0.15
dev_seed: 4242
eval_max_tokens: 2048
min_self_overall: 0.95

lora:
  rank: 8
  alpha: 16.0
  dropout: 0.05

train:
  learning_rate: 1.0e-4
  batch_size: 1
  gradient_accumulation_steps: 8
  epochs: 6
  max_seq_length: 0
  max_seq_length_cap: 8192
  train_on_completions: true
  grad_clip: 1.0
  grad_checkpoint: true
  # CUDA-only (ADR-068). Liger would be the better fix (fused linear cross-entropy, no
  # full logits tensor for Gemma's 262,144-token vocabulary) but liger 0.8.1 patches
  # nothing into `Gemma4ForConditionalGeneration` — verified on an A10G. Offloading saved
  # activations to CPU is the working lever. Both ignored on MLX.
  use_liger_kernel: false
  activation_offloading: true
  free_vision_audio: true
  wired_limit_gb: 0.0
  seed: 42
  steps_per_report: 10
  steps_per_save: 0
  checkpoint_every_epoch: true
  lr_schedule: cosine
  warmup_ratio: 0.03
  lr_min_ratio: 0.1
