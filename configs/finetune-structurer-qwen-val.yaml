# Re-baseline the zero-shot structurer on the reader-bake-off WINNER's val transcripts
# (issue #114, ADR-054 step 3). Identical to configs/finetune-structurer.yaml except the
# reader lineage: transcripts come from the GPU bake-off run of Qwen/Qwen3-VL-4B-Instruct
# (data/finetune/bakeoff/qwen__qwen3-vl-4b-instruct/, bf16 CUDA, 300 DPI, manifest prompt).
#
#   uv run python scripts/finetune_evaluate.py \
#     --config configs/finetune-structurer-qwen-val.yaml --split val \
#     --label zero-shot-qwen-reader --out data/finetune/eval-zeroshot-qwen-val.json
#
# Refs: ADR-054 (endgame), issue #114, scripts/gpu/README.md §7.

structurer_model: google/gemma-4-E4B-it
structuring_prompt_config: configs/arm-b.yaml
corpus_root: data/raw/german/zugferd-corpus
transcript_dir: data/finetune/bakeoff/qwen__qwen3-vl-4b-instruct
reader_model: Qwen/Qwen3-VL-4B-Instruct
split_path: data/finetune/split.json
adapter_dir: data/finetune/adapter
eval_max_tokens: 2048
min_self_overall: 0.95
